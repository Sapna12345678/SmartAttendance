<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Attendance - Projector</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: #182848;
            padding: 15px 25px;
        }

        .main {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .projector-card {
            width: 100%;
            max-width: 800px;
            background: white;
            color: #222;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.35);
        }

        .qr-container {
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode {
            padding: 15px;
            background: white;
            border-radius: 15px;
        }

        #qrcode img {
            margin: auto;
        }

        .session-box {
            background: #f1f4f9;
            color: #555;
            padding: 12px;
            border-radius: 10px;
            word-break: break-all;
            font-size: 13px;
        }

        .instruction {
            font-size: 20px;
            margin-top: 20px;
        }

        .url-box {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 10px;
            word-break: break-all;
            font-size: 14px;
            margin-top: 15px;
        }

        .active {
            display: inline-block;
            background: #d1fae5;
            color: #065f46;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="container-fluid">

        <span class="navbar-brand text-white fw-bold">
            📚 Smart Attendance
        </span>

        <a
            href="/"
            class="btn btn-light"
        >
            Dashboard
        </a>

    </div>

</nav>



<!-- MAIN -->

<div class="main">

    <div class="projector-card">


        <!-- ICON -->

        <div style="font-size: 60px;">
            📱
        </div>


        <!-- TITLE -->

        <h1 class="mt-3">
            Smart Attendance
        </h1>


        <h3 class="text-muted">
            Scan QR Code to Mark Attendance
        </h3>


        <!-- SESSION STATUS -->

        <div class="mt-4">

            <span class="active">
                ✓ Attendance Session Active
            </span>

        </div>


        <!-- QR CODE -->

        <div class="qr-container">

            <div id="qrcode"></div>

        </div>


        <!-- INSTRUCTION -->

        <div class="instruction">

            📷 Student apna personal QR code
            camera ke saamne rakhein.

        </div>


        <!-- SESSION ID -->

        <p class="text-muted mt-4 mb-2">
            Session ID
        </p>

        <div class="session-box">

            {{ session_id }}

        </div>


        <!-- SCAN URL -->

        <p class="text-muted mt-4 mb-2">
            Student Scan URL
        </p>

        <div class="url-box">

            <span id="attendanceUrl"></span>

        </div>


        <!-- BACK BUTTON -->

        <div class="mt-4">

            <a
                href="/generate-qr/"
                class="btn btn-primary"
            >
                ← Generate QR
            </a>

            <a
                href="/"
                class="btn btn-outline-secondary"
            >
                Dashboard
            </a>

        </div>


    </div>

</div>



<!-- QR CODE LIBRARY -->

<script
    src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
</script>


<script>

    // HTTPS server address

    const baseURL = "https://10.93.44.160:8000";


    // Attendance scanning URL

    const attendanceURL =
        baseURL + "/scan/?session={{ session_id }}";


    // Display URL on screen

    document.getElementById(
        "attendanceUrl"
    ).innerText = attendanceURL;


    // Generate QR Code

    new QRCode(

        document.getElementById("qrcode"),

        {
            text: attendanceURL,

            width: 350,

            height: 350,

            correctLevel:
                QRCode.CorrectLevel.H
        }

    );

</script>


</body>

</html>
