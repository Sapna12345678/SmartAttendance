
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Attendance - Projector</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: #182848;
            padding: 15px 25px;
        }

        .main {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .projector-card {
            width: 100%;
            max-width: 800px;
            background: white;
            color: #222;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.35);
        }

        .qr-container {
            margin: 25px auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode {
            padding: 15px;
            background: white;
            border-radius: 15px;
        }

        #qrcode img {
            margin: auto;
            display: block;
        }

        /* COUNTDOWN */

        .countdown-box {
            margin: 10px auto 25px;
            padding: 14px 25px;
            width: fit-content;
            min-width: 280px;
            border-radius: 15px;
            background: #eff6ff;
            border: 2px solid #3b82f6;
        }

        .countdown-label {
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
        }

        #countdown {
            font-size: 38px;
            font-weight: 800;
            color: #2563eb;
            margin-top: 3px;
        }

        #expiredMessage {
            display: none;
            color: #dc2626;
            font-size: 28px;
            font-weight: 800;
        }

        .session-box {
            background: #f1f4f9;
            color: #555;
            padding: 12px;
            border-radius: 10px;
            word-break: break-all;
            font-size: 13px;
        }

        .instruction {
            font-size: 20px;
            margin-top: 20px;
        }

        .url-box {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 10px;
            word-break: break-all;
            font-size: 14px;
            margin-top: 15px;
        }

        .active {
            display: inline-block;
            background: #d1fae5;
            color: #065f46;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
        }

        .expired {
            background: #fee2e2 !important;
            color: #991b1b !important;
            border-color: #ef4444 !important;
        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="container-fluid">

        <span class="navbar-brand text-white fw-bold">
            📚 Smart Attendance
        </span>

        <a
            href="/"
            class="btn btn-light"
        >
            Dashboard
        </a>

    </div>

</nav>



<div class="main">

    <div class="projector-card">


        <div style="font-size: 60px;">
            📱
        </div>


        <h1 class="mt-3">
            Smart Attendance
        </h1>


        <h3 class="text-muted">
            Scan QR Code to Mark Attendance
        </h3>


        <div class="mt-4">

            <span
                id="sessionStatus"
                class="active"
            >
                ✓ Attendance Session Active
            </span>

        </div>


        <!-- QR CODE -->

        <div
            class="qr-container"
            id="qrContainer"
        >

            <div id="qrcode"></div>

        </div>


        <!-- COUNTDOWN -->

        <div
            id="countdownBox"
            class="countdown-box"
        >

            <div class="countdown-label">
                QR CODE EXPIRES IN
            </div>

            <div id="countdown">
                60 Seconds
            </div>

            <div
                id="expiredMessage"
            >
                QR EXPIRED
            </div>

        </div>


        <div class="instruction">

            📷 Student apna phone camera
            QR code ke saamne rakhein.

        </div>


        <p class="text-muted mt-4 mb-2">
            Session ID
        </p>

        <div class="session-box">

            {{ session_id }}

        </div>


        <p class="text-muted mt-4 mb-2">
            Student Scan URL
        </p>

        <div class="url-box">

            <span id="attendanceUrl"></span>

        </div>


        <div class="mt-4">

            <a
                href="/generate-qr/"
                class="btn btn-primary"
            >
                ← Generate New QR
            </a>

            <a
                href="/"
                class="btn btn-outline-secondary"
            >
                Dashboard
            </a>

        </div>


    </div>

</div>



<script
    src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
</script>


<script>

    /*
     * Stable public Render URL
     */

    const baseURL =
        "https://smartattendance-edd1.onrender.com";


    /*
     * Current attendance session
     */

    const sessionId =
        "{{ session_id }}";


    /*
     * Student scan URL
     */

    const attendanceURL =
        baseURL +
        "/scan/?session=" +
        encodeURIComponent(sessionId);


    /*
     * Display URL
     */

    document.getElementById(
        "attendanceUrl"
    ).innerText = attendanceURL;


    /*
     * Generate QR
     */

    new QRCode(

        document.getElementById("qrcode"),

        {
            text: attendanceURL,

            width: 350,

            height: 350,

            correctLevel:
                QRCode.CorrectLevel.H
        }

    );


    /*
     * QR COUNTDOWN
     *
     * Backend default duration = 60 seconds
     */

    const qrDuration = 60;

    let secondsLeft = qrDuration;


    const countdown =
        document.getElementById(
            "countdown"
        );


    const countdownBox =
        document.getElementById(
            "countdownBox"
        );


    const expiredMessage =
        document.getElementById(
            "expiredMessage"
        );


    const sessionStatus =
        document.getElementById(
            "sessionStatus"
        );


    const qrContainer =
        document.getElementById(
            "qrContainer"
        );


    function updateCountdown() {

        if (secondsLeft > 0) {

            countdown.innerText =
                secondsLeft + " Seconds";

            secondsLeft--;

            setTimeout(
                updateCountdown,
                1000
            );

        } else {

            /*
             * QR EXPIRED
             */

            countdown.style.display =
                "none";

            expiredMessage.style.display =
                "block";

            countdownBox.classList.add(
                "expired"
            );

            sessionStatus.classList.remove(
                "active"
            );

            sessionStatus.classList.add(
                "expired"
            );

            sessionStatus.innerText =
                "✕ Attendance Session Expired";

        }

    }


    /*
     * Start countdown
     */

    updateCountdown();

</script>


</body>

</html>
