<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | Smart Attendance</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.20);
        }

        .logo {
            font-size: 55px;
            text-align: center;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            font-weight: bold;
            color: #212529;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-control {
            height: 50px;
            border-radius: 10px;
        }

        .login-btn {
            width: 100%;
            height: 50px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        .back-btn {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
        }

        .error-box {
            background: #f8d7da;
            color: #842029;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        👨‍🏫
    </div>

    <h2 class="title">
        Teacher Login
    </h2>

    <p class="subtitle">
        Smart Attendance System
    </p>

    {% if error %}

    <div class="error-box">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter teacher username"
                required
            >

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter password"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-primary login-btn"
        >
            🔐 Login as Teacher
        </button>

    </form>

    <a
        href="{% url 'home' %}"
        class="btn btn-outline-secondary back-btn"
    >
        ← Back to Home
    </a>

</div>

</body>

</html>
