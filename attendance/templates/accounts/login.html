<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login | Smart Attendance</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #0d6efd,
                #6610f2
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: auto;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0d6efd;
            color: white;

            font-size: 35px;
            font-weight: bold;
        }

        .title {
            font-weight: 700;
            color: #212529;
        }

        .subtitle {
            color: #6c757d;
        }

        .form-control {
            height: 50px;
            border-radius: 10px;
        }

        .login-btn {
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
        }

        .error-box {
            border-radius: 10px;
        }

        .footer {
            text-align: center;
            color: #6c757d;
            font-size: 13px;
            margin-top: 20px;
        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">


        <!-- LOGO -->

        <div class="logo mb-3">
            SA
        </div>


        <!-- TITLE -->

        <div class="text-center mb-4">

            <h2 class="title">
                Smart Attendance
            </h2>

            <p class="subtitle mb-0">
                Student Login
            </p>

        </div>


        <!-- ERROR -->

        {% if error %}

        <div class="alert alert-danger error-box">

            {{ error }}

        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                    autofocus
                >

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-primary w-100 login-btn"
            >

                Login to Dashboard

            </button>

        </form>


        <!-- INFO -->

        <div class="text-center mt-4">

            <small class="text-muted">

                Login with your registered student account.

            </small>

        </div>


    </div>


    <!-- FOOTER -->

    <div class="footer">

        Smart Attendance System © 2026

    </div>


</div>


</body>

</html>
