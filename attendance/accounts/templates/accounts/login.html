<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Login - Smart Attendance</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #182848,
                #4b6cb7
            );
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.25);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef3ff;
            color: #3155c7;
            font-size: 38px;
        }

        .title {
            font-weight: 700;
            color: #182848;
        }

        .form-control {
            height: 50px;
            border-radius: 10px;
        }

        .login-btn {
            height: 50px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            background: #3155c7;
            border: none;
        }

        .login-btn:hover {
            background: #182848;
        }

        .error-box {
            border-radius: 10px;
        }

        .footer-text {
            font-size: 13px;
            color: #777;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="login-card mx-auto">

        <!-- LOGO -->

        <div class="logo">

            <i class="bi bi-person-check"></i>

        </div>


        <!-- TITLE -->

        <div class="text-center">

            <h2 class="title">
                Student Login
            </h2>

            <p class="text-muted">
                Smart Attendance System
            </p>

        </div>


        <!-- ERROR -->

        {% if error %}

        <div class="alert alert-danger error-box">

            <i class="bi bi-exclamation-circle"></i>

            {{ error }}

        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form
            method="POST"
            class="mt-4"
        >

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label fw-bold">
                    Username
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person"></i>

                    </span>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label fw-bold">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-primary login-btn w-100"
            >

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </form>


        <!-- INFORMATION -->

        <div class="text-center mt-4">

            <p class="footer-text mb-1">
                Login to mark your attendance
            </p>

            <p class="footer-text mb-0">
                QR Code + Location Based Attendance
            </p>

        </div>

    </div>

</div>


</body>

</html>
