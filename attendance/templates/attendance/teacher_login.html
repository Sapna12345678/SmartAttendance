<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login | Smart Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #182848, #4b6cb7);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 15px 45px rgba(0,0,0,.25);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: auto;
            border-radius: 20px;
            background: #182848;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .title {
            font-weight: 700;
            color: #182848;
        }

        .subtitle {
            color: #777;
        }

        .form-control {
            height: 50px;
            border-radius: 10px;
        }

        .login-btn {
            height: 50px;
            width: 100%;
            border: none;
            border-radius: 10px;
            background: #182848;
            color: white;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #101b32;
        }

        .back-link {
            text-decoration: none;
            color: #182848;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="text-center">

        <div class="logo">
            <i class="bi bi-person-lock"></i>
        </div>

        <h2 class="title mt-4">
            Teacher Login
        </h2>

        <p class="subtitle">
            Sign in to manage Smart Attendance
        </p>

    </div>

    {% if error %}
    <div class="alert alert-danger mt-4">
        <i class="bi bi-exclamation-circle"></i>
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="mt-4">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter teacher username"
                required
            >
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            <i class="bi bi-box-arrow-in-right"></i>
            Login as Teacher
        </button>

    </form>

    <div class="text-center mt-4">
        <a href="/" class="back-link">
            <i class="bi bi-arrow-left"></i>
            Back to Smart Attendance
        </a>
    </div>

    <div class="footer">
        © 2026 Smart Attendance System
    </div>

</div>

</body>
</html>
